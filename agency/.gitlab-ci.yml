# Second Coat: lint, typecheck, build and smoke-test the Next.js app, then deploy it to Vercel.
# This file assumes the GitLab project root is the agency/ folder.
# GitLab > Settings > CI/CD > Variables: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (masked),
# and NEXT_PUBLIC_SITE_URL once the domain is live. In Vercel, set the project's Root Directory to web/apps/studio.
stages: [verify, deploy]

variables:
  PNPM_VERSION: '10.33.0'

.pnpm: &pnpm
  - corepack enable && corepack prepare pnpm@$PNPM_VERSION --activate
  - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"

verify:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.56.1-noble # same Playwright as web/apps/studio
  cache:
    key: { files: [web/pnpm-lock.yaml] }
    paths: [.pnpm-store]
  script:
    - *pnpm
    - cd web
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm typecheck
    - pnpm build
    - pnpm test:e2e # every route: 200, concept notice present, no errors, no horizontal scroll, noindex
  artifacts:
    when: on_failure
    paths: [web/apps/studio/playwright-report/, web/apps/studio/test-results/]
    expire_in: 1 week

.deploy:
  stage: deploy
  image: node:22
  needs: [verify]
  script:
    - *pnpm
    - npm i -g vercel@latest
    - vercel pull --yes --environment=$VERCEL_ENV --token=$VERCEL_TOKEN
    - vercel build $VERCEL_ARGS --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt $VERCEL_ARGS --token=$VERCEL_TOKEN | tee deploy-url.txt
  artifacts:
    paths: [deploy-url.txt]

preview:
  extends: .deploy
  variables: { VERCEL_ENV: preview, VERCEL_ARGS: '' }
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

production:
  extends: .deploy
  variables: { VERCEL_ENV: production, VERCEL_ARGS: '--prod' }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
